# main에 push될 때만 시연 서버(Oracle Cloud)에 자동 배포합니다.
# 코드만 올리고 서버에 있는 data/는 그대로 씁니다 (데이터는 GitHub에 없음 — 바뀌면 로컬에서 deploy.py --server로 전체 배포).
# 서버에서 이미지를 다시 만들며 화면 빌드 → 사전 계산(engine.build, 리허설 대조 실패 시 실패) → 컨테이너 교체.
# 필요한 비밀값: ORACLE_SSH_KEY (자동 배포 전용 SSH 개인 키, deploy/README.md)
name: 시연 서버 배포

on:
  push:
    branches: [main]

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

env:
  SERVER: ubuntu@129.225.152.209
  # 서버 신원 확인용 공개 호스트 키 (비밀 아님). 서버를 새로 만들면 ssh-keyscan으로 다시 받아 바꿉니다
  KNOWN_HOST: "129.225.152.209 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKsVMA8y49l6F4ZNZSnvu4LELU8XhE2I1oQIApvxBbPH"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts

      - name: 배포 (코드만 올리고 서버에서 빌드·사전 계산·교체)
        run: python deploy/deploy.py --server "$SERVER" --code-only --key ~/.ssh/deploy_key

      - name: 접속 확인
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://${SERVER#*@}/api/meta"; then echo "서버 응답 OK"; exit 0; fi
            sleep 2
          done
          echo "서버가 응답하지 않습니다"; exit 1
